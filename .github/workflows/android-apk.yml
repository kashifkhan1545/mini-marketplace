name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ['apps/mobile/**', 'packages/shared/**', '.github/workflows/android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public values only (the Supabase anon key is meant to be public). Set as repo variables.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMarket-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
